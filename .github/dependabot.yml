version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      tooling:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /engine
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
