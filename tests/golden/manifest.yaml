# Golden reference songs for /golden-eval. See README.md for how to add one.
#
# Audio is never committed (CLAUDE.md rule 8): `audio` is a path on your own machine,
# absolute or relative to the repo root. Entries whose audio is missing are skipped.
#
# Fields
#   id          unique kebab-case id, also the output folder .cache/golden/<id>
#   title       song title, for the report
#   type        piano-solo | full-mix | a-cappella | carnatic  (selects the pipeline path)
#   audio       local audio path, or TODO until the file is on this machine
#   expected
#     key       tonic note name, e.g. "G", "Bb"
#     mode      major | minor | modal
#     tonic_hz  optional measured tonic, mainly for a-cappella and carnatic
#     raga      optional, carnatic only
#     bpm       reference tempo; half/double are accepted but flagged
#   chords_lab  optional reference chord file (.lab: start end label), relative to this folder
#   midi        optional reference MIDI for note F1 (piano-solo), relative to this folder
#   notes       free text: why this song is in the set, known difficulties

