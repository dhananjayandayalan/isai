[project]
name = "isai"
version = "0.1.0"
description = "Isai pipeline: song audio in, Song JSON and MIDI out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "librosa>=0.11.0",
    "mido>=1.3.3",
    "numpy>=2.4.6",
    "pydantic>=2.9",
    "rfc3339-validator>=0.1.4",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
]

# The models (P4) need torch. Pick one build: `uv sync --extra cuda` (NVIDIA GPU) or
# `uv sync --extra cpu`. Without either, everything but the model stages works, and the
# fast tests run on fakes.
[project.optional-dependencies]
cpu = [
    "torch>=2.11",
    "torchaudio>=2.11",
    "piano-transcription-inference>=0.0.6",
    "torchcrepe>=0.0.24",
]
cuda = [
    "torch>=2.11",
    "torchaudio>=2.11",
    "piano-transcription-inference>=0.0.6",
    "torchcrepe>=0.0.24",
]

[project.scripts]
isai = "isai.cli:main"
gen-models = "isai.gen_models:main"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.170",
    "ruff>=0.8",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isai"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/isai/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: needs a GPU or downloaded models (deselect with -m \"not slow\")"]

[tool.coverage.run]
source = ["isai"]
omit = ["*/isai/generated/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
