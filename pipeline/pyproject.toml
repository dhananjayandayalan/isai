[project]
name = "isai"
version = "0.1.0"
description = "Isai pipeline: song audio in, Song JSON and MIDI out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "librosa>=0.11.0",
    "mido>=1.3.3",
    "numpy>=2.4.6",
    "pydantic>=2.9",
    "rfc3339-validator>=0.1.4",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
]

[project.scripts]
isai = "isai.cli:main"
gen-models = "isai.gen_models:main"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isai"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/isai/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: needs a GPU or downloaded models (deselect with -m \"not slow\")"]

[tool.coverage.run]
source = ["isai"]
omit = ["*/isai/generated/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
